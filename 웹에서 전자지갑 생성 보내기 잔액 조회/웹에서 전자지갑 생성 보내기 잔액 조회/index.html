<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>전자지갑 실습</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-latest.js"></script>
  
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.2/css/bootstrap.min.css">
  
  <!-- web3.js -->
  <script type="text/javascript" src="./js/web3.min.js"></script>
  
  <!-- ethereumjs-tx -->
  <script type="text/javascript" src="./js/ethereumjs-tx-1.3.3.min.js"></script>

  <style>
    /* 간단한 예시용 스타일 (원하는 대로 커스터마이징하세요) */
    body {
      margin-top: 20px;
    }
    .panel-heading {
      font-weight: bold;
      font-size: 1.2em;
    }
    .result-box {
      margin-top: 10px;
      padding: 10px;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      min-height: 50px;
    }
  </style>

  <script>
    $(document).ready(function () {
      let DEBUG = 1;

      // Sepolia 테스트넷 연결 예시
      const web3 = new Web3('https://sepolia.infura.io/v3/c0f13ed7b8e04c359f517d2d94cb771d');
      let Buffer = ethereumjs.Buffer.Buffer;
      let version = web3.version;

      if (DEBUG) {
        console.log('starting...');
        console.log("Ethereum API version:", version);
        console.log("web3:", web3);
      }

      // 1) 새 계정 생성
      $('#newAccountBtn').on('click', async function () {
        let account = web3.eth.accounts.create();

        // 결과 출력
        $('#newAccountResult').html(
          "새로운 계정이 생성되었습니다!<br>" +
          "<strong>Address:</strong> " + account.address + "<br>" +
          "<strong>Private Key:</strong> " + account.privateKey
        );

        // (참고) 생성된 address를 '보내기' 폼에도 자동 입력하고 싶다면 예시:
        // $('#sendFrom').val(account.address);
        // $('#sendPrivateKey').val(account.privateKey);
      });

      // 2) 잔액 조회
      $('#getBalanceBtn').on('click', async function () {
        let address = $("#balanceAddress").val().trim();
        if (!address) {
          alert("전자지갑 주소를 입력하세요.");
          return;
        }
        try {
          let getBalance = await web3.eth.getBalance(address);
          let balance = web3.utils.fromWei(getBalance, "ether");
          $('#balanceResult').text("잔액: " + balance + " ETH");
        } catch (err) {
          console.error(err);
          $('#balanceResult').text("잔액 조회 중 오류가 발생했습니다.");
        }
      });

      // 3) 코인 보내기
      $('#sendBtn').on('click', async function () {
        let fromaddress = $("#sendFrom").val().trim();
        let toaddress = $("#sendTo").val().trim();
        let amount = $("#sendAmount").val().trim();
        let myPrivateKey = $("#sendPrivateKey").val().trim();

        if (!fromaddress || !toaddress || !amount || !myPrivateKey) {
          alert("모든 입력 칸을 채워주세요.");
          return;
        }

        // 0x로 시작하는지 확인하고, 있다면 제거
        if (myPrivateKey.startsWith('0x')) {
          myPrivateKey = myPrivateKey.substring(2);
        }

        const privateKey = Buffer.from(myPrivateKey, 'hex');
        if (DEBUG) console.log("privateKey: ", privateKey);

        try {
          // nonce 가져오기
          let txCount = await web3.eth.getTransactionCount(fromaddress);

          // 트랜잭션 객체 생성
          const txObject = {
            nonce: web3.utils.toHex(txCount),
            to: toaddress,
            value: web3.utils.toHex(web3.utils.toWei(amount, 'ether')),
            gasLimit: web3.utils.toHex(21000),
            gasPrice: web3.utils.toHex(web3.utils.toWei('10', 'gwei'))
          };

          // 트랜잭션 서명
          const tx = new ethereumjs.Tx(txObject);
          tx.sign(privateKey);

          const serializedTx = tx.serialize();
          const raw = '0x' + serializedTx.toString('hex');

          // 트랜잭션 전송
          web3.eth.sendSignedTransaction(raw)
            .on('transactionHash', function (hash) {
              if (DEBUG) console.log('txHash:', hash);
              $('#sendResult').html(
                "트랜잭션이 전송되었습니다!<br>" +
                "<strong>txHash:</strong> " + hash
              );
            })
            .on('error', function (error) {
              console.error(error);
              $('#sendResult').text("트랜잭션 전송 중 오류가 발생했습니다.");
            });

        } catch (err) {
          console.error(err);
          $('#sendResult').text("트랜잭션 생성 또는 전송 중 오류가 발생했습니다.");
        }
      });
    });
  </script>
</head>

<body>
<div class="container">
  <!-- 1. 전자지갑 새로 만들기 -->
  <div class="panel panel-default">
    <div class="panel-heading">전자지갑 새로 만들기</div>
    <div class="panel-body">
      <p>버튼을 누르면 새로운 계정(Address, PrivateKey)이 생성됩니다.</p>
      <button id="newAccountBtn" class="btn btn-primary">새로 만들기</button>
      <div id="newAccountResult" class="result-box"></div>
    </div>
  </div>

  <!-- 2. 잔액 조회 -->
  <div class="panel panel-default">
    <div class="panel-heading">잔액 조회</div>
    <div class="panel-body">
      <div class="form-group">
        <label for="balanceAddress">조회할 전자지갑 주소</label>
        <input id="balanceAddress" type="text" class="form-control" placeholder="0x...">
      </div>
      <button id="getBalanceBtn" class="btn btn-success">잔액조회</button>
      <div id="balanceResult" class="result-box"></div>
    </div>
  </div>

  <!-- 3. 코인 보내기 -->
  <div class="panel panel-default">
    <div class="panel-heading">코인 보내기</div>
    <div class="panel-body">
      <div class="form-group">
        <label for="sendFrom">보내는 계좌 (From)</label>
        <input id="sendFrom" type="text" class="form-control" placeholder="보내는 전자지갑 주소 (0x...)">
      </div>
      <div class="form-group">
        <label for="sendTo">받는 계좌 (To)</label>
        <input id="sendTo" type="text" class="form-control" placeholder="받는 전자지갑 주소 (0x...)">
      </div>
      <div class="form-group">
        <label for="sendAmount">코인 수량 (ETH)</label>
        <input id="sendAmount" type="text" class="form-control" placeholder="예) 0.01">
      </div>
      <div class="form-group">
        <label for="sendPrivateKey">비밀번호(개인키)</label>
        <input id="sendPrivateKey" type="text" class="form-control" placeholder="개인키 (0x...)">
      </div>
      <button id="sendBtn" class="btn btn-danger">보내기</button>
      <div id="sendResult" class="result-box"></div>
    </div>
  </div>
</div>
</body>
</html>
